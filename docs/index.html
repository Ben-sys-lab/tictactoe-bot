<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Крестики-нолики</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: var(--tg-theme-bg-color, #17212b);
    color: var(--tg-theme-text-color, #fff);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .container { width: 100%; max-width: 340px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .subtitle { opacity: .7; font-size: 14px; margin-bottom: 24px; }
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 auto 16px; }
  .cell {
    aspect-ratio: 1; background: var(--tg-theme-secondary-bg-color, #232e3c);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 700; user-select: none;
    transition: transform .1s, background .2s;
  }
  .cell:active { transform: scale(.95); }
  .cell.x { color: #4fc3f7; }
  .cell.o { color: #ff8a80; }
  .cell.win { background: #2e7d32 !important; }
  button.primary {
    width: 100%; padding: 16px; font-size: 17px; font-weight: 600;
    border: none; border-radius: 12px;
    background: var(--tg-theme-button-color, #5288c1);
    color: var(--tg-theme-button-text-color, #fff); cursor: pointer;
  }
  button.primary:active { opacity: .8; }
  .status { font-size: 16px; margin: 12px 0; min-height: 24px; opacity: .9; }
  .hidden { display: none !important; }
  .price { font-size: 30px; font-weight: 700; margin: 22px 0; }
</style>
</head>
<body>
<div class="container">
  <div id="play-screen">
    <h1>Крестики-нолики</h1>
    <div class="subtitle">Ты — ❌, бот — ⭕</div>
    <div class="board" id="board"></div>
    <div class="status" id="status"></div>
  </div>

  <div id="pay-screen" class="hidden">
    <h1>Игра окончена</h1>
    <p>Хочешь сыграть ещё раз?</p>
    <div class="price">15 ₽</div>
    <button class="primary" id="pay-btn">Оплатить</button>
    <p style="opacity:.6; font-size:13px; margin-top:16px;">
      После оплаты напиши админу бота — он подтвердит вручную.
    </p>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const BOT_USERNAME = '8737526387:AAFia77yGJI0eRzMq7_M9Hzm8aSy0Yl332g'; // ← замени на ник своего бота (без @)
const userId = tg?.initDataUnsafe?.user?.id ?? 'guest';
const KEY = 'tn_plays_' + userId;

let board = Array(9).fill('');
let gameOver = false;
let plays = 0;

/* ---------- storage ---------- */
function getPlays(cb) {
  if (tg?.CloudStorage) {
    tg.CloudStorage.getItem(KEY, (err, val) => {
      if (err || val == null) cb(parseInt(localStorage.getItem(KEY) || '0'));
      else cb(parseInt(val));
    });
  } else cb(parseInt(localStorage.getItem(KEY) || '0'));
}
function setPlays(n, cb) {
  localStorage.setItem(KEY, n);
  if (tg?.CloudStorage) tg.CloudStorage.setItem(KEY, String(n), () => cb && cb());
  else cb && cb();
}

/* ---------- AI: unbeatable minimax ---------- */
const WIN_LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];
function winner(b) {
  for (const [a,c,d] of WIN_LINES)
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
  return b.includes('') ? null : 'draw';
}
function minimax(b, depth, isMax) {
  const w = winner(b);
  if (w === 'O') return 10 - depth;
  if (w === 'X') return depth - 10;
  if (w === 'draw') return 0;
  if (isMax) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) if (!b[i]) {
      b[i] = 'O'; best = Math.max(best, minimax(b, depth + 1, false)); b[i] = '';
    }
    return best;
  } else {
    let best = Infinity;
    for (let i = 0; i < 9; i++) if (!b[i]) {
      b[i] = 'X'; best = Math.min(best, minimax(b, depth + 1, true)); b[i] = '';
    }
    return best;
  }
}
function bestMove(b) {
  let best = -Infinity, move = -1;
  for (let i = 0; i < 9; i++) if (!b[i]) {
    b[i] = 'O';
    const s = minimax(b, 0, false);
    b[i] = '';
    if (s > best) { best = s; move = i; }
  }
  return move;
}

/* ---------- UI ---------- */
const boardEl   = document.getElementById('board');
const statusEl  = document.getElementById('status');
const playScreen= document.getElementById('play-screen');
const payScreen = document.getElementById('pay-screen');

function renderBoard() {
  boardEl.innerHTML = '';
  board.forEach((v, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell' + (v ? ' ' + v.toLowerCase() : '');
    cell.textContent = v === 'X' ? '❌' : v === 'O' ? '⭕' : '';
    cell.onclick = () => onCellClick(i);
    boardEl.appendChild(cell);
  });
}
function highlightWin(line) {
  const cells = boardEl.children;
  line.forEach(i => cells[i].classList.add('win'));
}
function onCellClick(i) {
  if (gameOver || board[i]) return;
  board[i] = 'X';
  renderBoard();
  let w = winner(board);
  if (w) return endGame(w);
  statusEl.textContent = 'Ход бота…';
  setTimeout(() => {
    const m = bestMove(board);
    if (m >= 0) { board[m] = 'O'; renderBoard(); }
    w = winner(board);
    if (w) return endGame(w);
    statusEl.textContent = 'Твой ход';
  }, 250);
}
function endGame(result) {
  gameOver = true;
  if (result !== 'draw') {
    for (const line of WIN_LINES) {
      const [a,b,c] = line;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) highlightWin(line);
    }
  }
  if (result === 'O') statusEl.textContent = 'Бот выиграл 😈';
  else if (result === 'draw') statusEl.textContent = 'Ничья 🤝';
  else statusEl.textContent = 'Ты выиграл (не должен был!)';

  plays += 1;
  setPlays(plays, () => setTimeout(showPayScreen, 1600));
}
function showPayScreen() {
  playScreen.classList.add('hidden');
  payScreen.classList.remove('hidden');
}
function showPlayScreen() {
  payScreen.classList.add('hidden');
  playScreen.classList.remove('hidden');
  board = Array(9).fill('');
  gameOver = false;
  statusEl.textContent = 'Твой ход';
  renderBoard();
}

document.getElementById('pay-btn').onclick = () => {
  const link = `https://t.me/${BOT_USERNAME}?start=pay`;
  if (tg) tg.openTelegramLink(link);
  else window.open(link, '_blank');
};

/* ---------- init ---------- */
const params = new URLSearchParams(location.search);
if (params.get('paid') === '1') {
  // админ одобрил — сбрасываем счётчик, даём сыграть
  setPlays(0, () => {
    history.replaceState({}, '', location.pathname);
    getPlays(n => { plays = n; showPlayScreen(); });
  });
} else {
  getPlays(n => { plays = n; plays >= 1 ? showPayScreen() : showPlayScreen(); });
}
</script>
</body>
</html>
